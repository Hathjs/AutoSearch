# AutoSearch SFT Training Configuration
data:
  train_batch_size: 64
  micro_batch_size: 4  # gradient accumulation steps = train_batch_size / micro_batch_size
  train_files: data/autosearch_sft_processed/train.parquet
  val_files: data/autosearch_sft_processed/val.parquet
  prompt_key: question  # column name in parquet for prompt
  response_key: answer  # column name in parquet for response
  max_length: 4096
  truncation: error
  balance_dp_token: False
  chat_template: null

model:
  partial_pretrain: /home/hadoop-ai-search/dolphinfs_ssd_hadoop-ai-search/chongwenyue/model/Qwen2.5-3B-Instruct
  fsdp_config:
    wrap_policy:
      min_num_params: 0
    cpu_offload: False
    offload_params: False
  external_lib: null
  enable_gradient_checkpointing: False
  trust_remote_code: True
  lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
  lora_alpha: 16  # LoRA scaling factor
  target_modules: [q_proj, v_proj]  # Target modules for LoRA adaptation

optim:
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  clip_grad: 1.0

trainer:
  default_local_dir: ./checkpoints/autosearch_sft
  default_hdfs_dir: null  # Set to HDFS path if needed
  resume_path: null
  project_name: autosearch-sft
  experiment_name: qwen2.5-3b-v1
  total_epochs: 1
  total_training_steps: null
  validate_before_training: False
  logger: ['console']  # Change to ['console', 'wandb'] if wandb is configured
  seed: 42
