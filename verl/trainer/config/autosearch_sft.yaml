# AutoSearch SFT Training Configuration
data:
  train_batch_size: 64
  micro_batch_size: 64  # gradient accumulation steps = train_batch_size / micro_batch_size (must be divisible by dp_size=8)
  # 注意：micro_batch_size 不能太小，否则每个GPU的micro_batch太小（<8）可能导致FSDP数值不稳定
  # 建议：micro_batch_size >= train_batch_size，这样每个GPU不需要分割batch，避免数值精度问题
  train_files: /mnt/dolphinfs/ssd_pool/docker/user/hadoop-ai-search/chenqing30/cqproject/autosearch/data/autosearch_sft_final_processed/train.parquet
  val_files: /mnt/dolphinfs/ssd_pool/docker/user/hadoop-ai-search/chenqing30/cqproject/autosearch/data/autosearch_sft_final_processed/val.parquet
  prompt_key: question  # column name in parquet for prompt
  response_key: answer  # column name in parquet for response
  max_length: 4096
  truncation: error
  balance_dp_token: False
  chat_template: null

model:
  partial_pretrain: /mnt/dolphinfs/ssd_pool/docker/user/hadoop-ai-search/chongwenyue/model/Qwen2.5-3B-Instruct
  fsdp_config:
    wrap_policy:
      min_num_params: 0
    cpu_offload: False
    offload_params: False
  external_lib: null
  enable_gradient_checkpointing: False
  trust_remote_code: True
  # Attention implementation: 'flash_attention_2' (fast, but may have compatibility issues),
  # 'sdpa' (PyTorch standard, more stable), or None (use model default)
  attn_implementation: 'sdpa'  # Changed to 'sdpa' to avoid Flash Attention SIGFPE issues
  lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
  lora_alpha: 16  # LoRA scaling factor
  target_modules: [q_proj, v_proj]  # Target modules for LoRA adaptation

optim:
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  clip_grad: 1.0

trainer:
  default_local_dir: ./checkpoints/autosearch_sft_outdata
  default_hdfs_dir: null  # Set to HDFS path if needed
  resume_path: null
  project_name: autosearch-sft
  experiment_name: qwen2.5-3b-v1
  total_epochs: 3
  total_training_steps: null
  validate_before_training: False
  # 临时开关：是否跳过 validation（用于排查 SIGFPE 问题）
  # 如果设为 true，训练会跳过所有 validation，直接完成所有 epoch
  skip_validation: false  # 现在训练能跑了，可以恢复 validation 测试
  # 临时开关：validation 阶段是否做跨 rank all_reduce 规约
  # 用于排查 "Starting validation..." 后立刻 SIGFPE 的问题
  # 如果关闭后训练能跑通，则基本可确认是 all_reduce / NCCL / 规约触发的底层异常
  val_all_reduce: false
  logger: ['console']  # Change to ['console', 'wandb'] if wandb is configured
  seed: 42
