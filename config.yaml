# LLM Backend Configurations
llm_backends:
  deepseek_main:
    base_url: https://aigc.sankuai.com/v1/openai/native
    model: deepseek-chat
    temperature: 0.7
    max_context_tokens: 32000
    max_response_tokens: 8192
    timeout_seconds: 180
    rpm: 50

  gpt4_main:
    base_url: https://aigc.sankuai.com/v1/openai/native
    model: gpt-4
    temperature: 0.7
    max_context_tokens: 32000
    max_response_tokens: 8192
    timeout_seconds: 180
    rpm: 50

# Execution Configuration
execution:
  max_concurrent: 10  # Moderate concurrency to be safe
  max_retries: 3
  retry_delay: 5
