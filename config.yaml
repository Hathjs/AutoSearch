    description: "Main API key 2"
  - key_id: main_key_3
    api_key: "2004474866040889391"
    base_url: https://aigc.sankuai.com/v1/openai/native
    description: "Main API key 3"
  - key_id: main_key_4
    api_key: "2004474880758530095"
    base_url: https://aigc.sankuai.com/v1/openai/native
